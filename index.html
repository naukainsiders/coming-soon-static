<title>Nauka — Coming Soon</title>
<meta name="description" content="Nauka is coming soon. Stay tuned!">
<meta name="theme-color" content="#06382a">
<link rel="preconnect" href="https://fonts.googleapis.com">

<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --forest: #06382a;   /* brand green from the logo */
    --cream:  #f7f0df;   /* tone 1: logo + "Coming soon" */
    --gold:   #f0c879;   /* tone 2: "stay tuned!" */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--forest); color: var(--cream); overflow: hidden; }

  /* ---------- Hero video ---------- */
  .hero { position: relative; height: 100%; width: 100%; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(6,56,42,.62) 0%, rgba(6,56,42,.18) 40%, rgba(6,56,42,.18) 60%, rgba(6,56,42,.72) 100%);
  }

  /* ---------- Content ---------- */
  .content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; text-align: center;
    padding: 0 24px;
    padding-top: clamp(32px, 9vh, 96px);
    padding-bottom: clamp(36px, 10vh, 104px);
  }

  /* ---------- Logo: handwritten, then the palm blooms ---------- */
  .logo {
    position: relative;
    width: clamp(154px, 26.6vw, 364px);
    aspect-ratio: 1000 / 608;
    align-self: flex-start;
    margin-left: calc(34vw - clamp(154px, 26.6vw, 364px) / 2);
    margin-top: max(0px, calc(29vh - clamp(154px, 26.6vw, 364px) * .304 - clamp(32px, 9vh, 96px)));
    filter: drop-shadow(0 4px 22px rgba(0,0,0,.35));
  }
  .logo canvas, .logo .frond { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frond {
    opacity: 0;
    transform-origin: 85.5% 27.8%;          /* where the fronds meet */
    transform: scale(.05) rotate(-30deg);
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .logo.bloom .frond {
    animation: bloom .42s cubic-bezier(.2,.9,.3,1.4) forwards;
    animation-delay: calc(var(--t0, 0s) + var(--i) * .035s);
  }
  @keyframes bloom {
    0%   { opacity: 0; transform: scale(.05) rotate(-30deg); }
    18%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* ---------- Coming soon ---------- */
  .soon { opacity: 0; will-change: opacity; position: relative;
    padding-bottom: calc(clamp(10px, 1.6vw, 18px) + 1.445 * clamp(.85rem, 1.7vw, 1.25rem)); }
  .soon.show { animation: fade .7s ease-out forwards; }
  .soon .a {
    display: block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(2.4rem, 6.4vw, 5rem); line-height: 1;
    color: var(--cream); text-shadow: 0 2px 20px rgba(0,0,0,.35);
  }
  .soon .c {
    position: absolute; left: 50%; transform: translateX(-50%); width: max-content;
    top: calc(clamp(2.4rem, 6.4vw, 5rem) + clamp(14px, 2.2vw, 26px));
    max-width: min(34em, calc(100vw - 48px)); margin: 0;
    font-family: "Jost", system-ui, sans-serif; font-weight: 400;
    font-size: clamp(.95rem, 1.9vw, 1.3rem); line-height: 1.65; letter-spacing: .02em;
    color: var(--cream); text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  .soon .c em {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600;
    font-size: 1.25em; letter-spacing: 0; color: var(--gold);
  }
  @keyframes fade { to { opacity: 1; } }

  /* big blur filter re-rasterises every frame on phones and stalls the bloom */
  @media (max-width: 820px), (hover: none) { .logo { filter: none; } }

  @media (prefers-reduced-motion: reduce) {
    .frond { opacity: 1 !important; transform: none !important; animation: none !important; }
    .soon { opacity: 1; animation: none !important; }
  }
</style>

  const DRAW = 3.760;      // seconds the pen takes to write the word
  const START = 0.5;        // pause before writing starts
  const W = 1000, H = 608;

  const logo = document.getElementById('logo');
  const soon = document.getElementById('soon');
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // video starts only once the logo sequence is under way (or after a safety timeout)
  let videoStarted = false;
  const startVideo = () => {
    if (videoStarted) return; videoStarted = true;
    const v = document.querySelector('.hero video'), src = v && v.querySelector('source[data-src]');
    if (!src) return;
    src.src = src.dataset.src; v.load();
    const p = v.play(); if (p && p.catch) p.catch(() => {});
  };
  setTimeout(startVideo, 2500);

  const load = src => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
  });
  // decode the six frond images up-front so they don't hitch when the bloom starts
  const predecode = img => (img.decode ? img.decode() : Promise.resolve()).catch(() => {});
  const pixels = img => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0); return x.getImageData(0, 0, W, H).data;
  };

  Promise.all([load(BASE), load(TIME), ...[...document.querySelectorAll('.frond')].map(predecode)])
  .then(([baseImg, timeImg]) => {
    const bd = pixels(baseImg), td = pixels(timeImg);
    const N = W * H;

    // Bucket every pixel by the moment the pen reaches it
    const counts = new Uint32Array(257);
    for (let i = 0; i < N; i++) counts[td[i * 4] + 1]++;
    for (let t = 1; t < 257; t++) counts[t] += counts[t - 1];
    const order = new Uint32Array(N), fill = counts.slice();
    for (let i = 0; i < N; i++) order[fill[td[i * 4]]++] = i;

    const out = ctx.createImageData(W, H);
    for (let i = 0; i < N; i++) {
      out.data[i * 4] = bd[i * 4]; out.data[i * 4 + 1] = bd[i * 4 + 1]; out.data[i * 4 + 2] = bd[i * 4 + 2];
    }
    let done = 0;
    const reveal = upTo => {                       // reveal pixels with time <= upTo
      let x0 = W, y0 = H, x1 = -1, y1 = -1;
      for (let t = done + 1; t <= upTo; t++)
        for (let k = counts[t]; k < counts[t + 1]; k++) {
          const i = order[k], p = i * 4;
          if (!bd[p + 3]) continue;
          out.data[p + 3] = bd[p + 3];
          const x = i % W, y = (i / W) | 0;
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      done = upTo;
      // upload only the part of the canvas that changed (much lighter on phones)
      if (x1 >= 0) ctx.putImageData(out, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
    };

    // one shared clock: starts on the first painted frame after everything is ready
    requestAnimationFrame(t0 => {
      const bloomAt = START + DRAW;                  // the instant the pen finishes
      logo.style.setProperty('--t0', bloomAt + 's');
      soon.style.animationDelay = (bloomAt + 0.05) + 's';
      logo.classList.add('bloom');
      soon.classList.add('show');
      startVideo();
      if (reduce) { reveal(255); return; }
      const tick = now => {
        const p = Math.min(Math.max((now - t0) / 1000 - START, 0) / DRAW, 1);
        const upTo = p >= 1 ? 255 : Math.floor(p * 254);
        if (upTo > done) reveal(upTo);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }).catch(startVideo);
})();
